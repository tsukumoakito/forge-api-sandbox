name: CI Arch Kernel Build

on:
  push:
    branches: [ master, dev ]
    paths:
      - 'arch/**'
      - '.github/workflows/ci-arch-kernel.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build-arch-kernel:
    name: Arch Linux Kernel Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lightweight Ubuntu runner (free disk space)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af || true
          df -h

      - name: Build Arch kernel package in Arch Linux container
        run: |
          mkdir -p "$PWD/pkg_out" "$PWD/pkg_src"
          cp -a "$PWD/arch/." "$PWD/pkg_src/"
          chmod 777 "$PWD/pkg_out"
          chmod -R a+rwX "$PWD/pkg_src"

          docker run --rm \
            -v "$PWD/pkg_src:/build/src" \
            -v "$PWD/pkg_out:/build/out" \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel sudo

              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

              sed -i "s/^#MAKEFLAGS=.*/MAKEFLAGS=\"-j\$(nproc)\"/" /etc/makepkg.conf
              chown -R builder:builder /build

              su - builder -c "cd /build/src && PKGDEST=/build/out makepkg -s --noconfirm"
            '
          ls -lh "$PWD/pkg_out"

      - name: Upload kernel package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-kernel-x86_64
          path: pkg_out/*.pkg.tar.zst
          retention-days: 1

  publish-package:
    name: Push Arch Kernel to GitHub Packages
    needs: build-arch-kernel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download kernel package
        uses: actions/download-artifact@v4
        with:
          name: arch-kernel-x86_64
          path: pkg_in

      - name: Install ORAS CLI
        run: |
          oras_ver=$(curl -fsSL https://api.github.com/repos/oras-project/oras/releases/latest | jq -r '.tag_name | ltrimstr("v")')
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${oras_ver}/oras_${oras_ver}_linux_amd64.tar.gz" -o /tmp/oras.tar.gz
          sudo tar -xzf /tmp/oras.tar.gz -C /usr/local/bin oras

      - name: Push kernel package to GitHub Packages (GHCR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          cd pkg_in
          oras push "ghcr.io/${repo_lower}:arch-kernel-x86_64" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            *.pkg.tar.zst
