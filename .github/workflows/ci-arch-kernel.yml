name: CI Arch Kernel Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify-trigger:
    name: Verify CI Trigger Policy
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allow_publish: ${{ steps.check.outputs.allow_publish }}
      pkg_tag_suffix: ${{ steps.check.outputs.pkg_tag_suffix }}

    steps:
      - name: Checkout minimal git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github

      - name: Validate trigger policy
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Tag push detected: ${{ github.ref_name }} (${{ github.sha }})"
            git fetch --no-tags --filter=blob:none origin refs/heads/master
            if ! git merge-base --is-ancestor "${{ github.sha }}" FETCH_HEAD; then
              echo "::error::Tag '${{ github.ref_name }}' is NOT on 'master'. Packages will only be built from master tags."
              exit 1
            fi
            safe_tag=$(printf '%s' "${{ github.ref_name }}" | tr '/+' '--')
            echo "allow_publish=true" >> "$GITHUB_OUTPUT"
            echo "pkg_tag_suffix=-${safe_tag}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger on '${{ github.ref_name }}' (test-only mode: Packages save is disabled)."
            echo "allow_publish=false" >> "$GITHUB_OUTPUT"
            echo "pkg_tag_suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unsupported trigger '${{ github.event_name }}' on '${{ github.ref }}'."
            exit 1
          fi

  build-arch-kernel:
    name: Arch Linux Kernel Build
    needs: verify-trigger
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure sufficient disk space on Ubuntu runner
        run: |
          avail_kb=$(df --output=avail / | tail -n1 | tr -d ' ')
          if [ "$avail_kb" -lt 41943040 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
            docker system prune -af || true
          fi
          df -h

      - name: Build Arch kernel package in Arch Linux container
        run: |
          mkdir -p "$PWD/pkg_out" "$PWD/pkg_src"
          cp -a "$PWD/arch/." "$PWD/pkg_src/"
          chmod 777 "$PWD/pkg_out"
          chmod -R a+rwX "$PWD/pkg_src"

          docker run --rm -i \
            -v "$PWD/pkg_src:/build/src" \
            -v "$PWD/pkg_out:/build/out" \
            archlinux:latest \
            bash -euo pipefail -s <<'EOF'
          [ -s /etc/machine-id ] || systemd-machine-id-setup >/dev/null 2>&1 || printf '00000000000000000000000000000000\n' > /etc/machine-id
          pacman -Syu --noconfirm --needed base-devel sudo

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

          sed -i "s/^#MAKEFLAGS=.*/MAKEFLAGS=\"-j\$(nproc)\"/" /etc/makepkg.conf
          chown -R builder:builder /build

          su - builder -c "cd /build/src && PKGDEST=/build/out makepkg -s --noconfirm"
          EOF
          ls -lh "$PWD/pkg_out"

      - name: Upload kernel package artifact
        if: needs.verify-trigger.outputs.allow_publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: arch-kernel-x86_64
          path: pkg_out/*.pkg.tar.zst
          retention-days: 1

  publish-package:
    name: Push Arch Kernel to GitHub Packages
    needs: [ verify-trigger, build-arch-kernel ]
    if: success() && needs.verify-trigger.outputs.allow_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download kernel package
        uses: actions/download-artifact@v8
        with:
          name: arch-kernel-x86_64
          path: pkg_in

      - name: Install ORAS CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oras_ver=$(gh api repos/oras-project/oras/releases/latest --jq '.tag_name | ltrimstr("v")')
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${oras_ver}/oras_${oras_ver}_linux_amd64.tar.gz" -o /tmp/oras.tar.gz
          sudo tar -xzf /tmp/oras.tar.gz -C /usr/local/bin oras

      - name: Push kernel package to GitHub Packages (GHCR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_SUFFIX: ${{ needs.verify-trigger.outputs.pkg_tag_suffix }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          pkg_tag="arch-kernel-x86_64${TAG_SUFFIX}"
          echo ">>> Pushing ${pkg_tag} to ghcr.io/${repo_lower}:${pkg_tag}"
          cd pkg_in
          oras push "ghcr.io/${repo_lower}:${pkg_tag}" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            *.pkg.tar.zst
