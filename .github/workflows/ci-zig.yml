name: CI Zig Cross-Platform Matrix

on:
  push:
    branches: [ master, dev ]
    paths:
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/ci-zig.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ------------------------------------------------------------------
  # 1 & 2. Ubuntu 軽量化（必要時のみ）-> Arch Linux コンテナ -> Zig 0.17.1 / 0.16.0
  # ------------------------------------------------------------------
  zig-archlinux:
    name: Arch Linux / Zig ${{ matrix.zig_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        zig_version: [ "0.17.1", "0.16.0" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure sufficient disk space on Ubuntu runner
        run: |
          avail_kb=$(df --output=avail / | tail -n1 | tr -d ' ')
          if [ "$avail_kb" -lt 41943040 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            docker system prune -af || true
          fi
          df -h

      - name: Install Zig ${{ matrix.zig_version }}, build, test & run in Arch Linux
        run: |
          mkdir -p "$PWD/out"
          docker run --rm -i \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e ZIG_VERSION="${{ matrix.zig_version }}" \
            archlinux:latest \
            bash -euo pipefail -s <<'EOF'
          [ -s /etc/machine-id ] || systemd-machine-id-setup >/dev/null 2>&1 || printf '00000000000000000000000000000000\n' > /etc/machine-id
          pacman -Syu --noconfirm --needed curl jq make tar xz

          meta=$(curl -fsSL https://ziglang.org/download/index.json)
          url=$(printf "%s" "$meta" | jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].tarball')
          sum=$(printf "%s" "$meta" | jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].shasum')
          [ -n "$url" ] && [ "$url" != "null" ]

          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "${sum}  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz --strip-components=1 -C /opt/zig
          ln -sf /opt/zig/zig /usr/local/bin/zig

          make clean build test run OUT_DIR="out"
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zig-${{ matrix.zig_version }}-archlinux
          path: out/sandbox-zig
          retention-days: 1

  # ------------------------------------------------------------------
  # 3 & 4. macOS -> Zig 0.17.1 / 0.16.0
  # ------------------------------------------------------------------
  zig-macos:
    name: macOS / Zig ${{ matrix.zig_version }}
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        zig_version: [ "0.17.1", "0.16.0" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zig ${{ matrix.zig_version }}
        env:
          ZIG_VERSION: ${{ matrix.zig_version }}
        run: |
          arch_key="aarch64-macos"
          [ "$(uname -m)" = "x86_64" ] && arch_key="x86_64-macos"

          meta=$(curl -fsSL https://ziglang.org/download/index.json)
          url=$(printf "%s" "$meta" | jq -r --arg v "$ZIG_VERSION" --arg a "$arch_key" '.[$v][$a].tarball')
          sum=$(printf "%s" "$meta" | jq -r --arg v "$ZIG_VERSION" --arg a "$arch_key" '.[$v][$a].shasum')
          [ -n "$url" ] && [ "$url" != "null" ]

          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "${sum}  /tmp/zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/zig"
          tar -xJf /tmp/zig.tar.xz --strip-components=1 -C "$HOME/.local/zig"
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"

      - name: Build, test & run via Makefile
        run: make clean build test run OUT_DIR="out"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zig-${{ matrix.zig_version }}-macos
          path: out/sandbox-zig
          retention-days: 1

  # ------------------------------------------------------------------
  # 5 & 6. Windows -> Zig 0.17.1 / 0.16.0
  # ------------------------------------------------------------------
  zig-windows:
    name: Windows / Zig ${{ matrix.zig_version }}
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        zig_version: [ "0.17.1", "0.16.0" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GNU Make & Zig ${{ matrix.zig_version }}
        shell: pwsh
        env:
          ZIG_VERSION: ${{ matrix.zig_version }}
        run: |
          choco install make -y --no-progress

          $idx = Invoke-RestMethod -Uri "https://ziglang.org/download/index.json"
          $entry = $idx."$env:ZIG_VERSION"."x86_64-windows"
          if (-not $entry) { throw "Zig $env:ZIG_VERSION x86_64-windows not found" }

          $zipPath = "$env:TEMP\zig.zip"
          Invoke-WebRequest -Uri $entry.tarball -OutFile $zipPath
          $actual = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $entry.shasum.ToLower()) { throw "SHA256 mismatch" }

          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\zig-extract" -Force
          $zigDir = Get-ChildItem -Path "$env:TEMP\zig-extract" -Directory | Select-Object -First 1
          if (Test-Path "C:\zig") { Remove-Item -Recurse -Force "C:\zig" }
          Move-Item -Path $zigDir.FullName -Destination "C:\zig"
          "C:\zig" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build, test & run via Makefile
        shell: bash
        run: make clean build test run OUT_DIR="out"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zig-${{ matrix.zig_version }}-windows
          path: out/sandbox-zig.exe
          retention-days: 1

  # ------------------------------------------------------------------
  # 全 6 バイナリを GitHub Packages (ghcr.io) に保存
  # ------------------------------------------------------------------
  publish-packages:
    name: Push Zig binaries to GitHub Packages
    needs: [ zig-archlinux, zig-macos, zig-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v8
        with:
          path: packages_in

      - name: Install ORAS CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oras_ver=$(gh api repos/oras-project/oras/releases/latest --jq '.tag_name | ltrimstr("v")')
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${oras_ver}/oras_${oras_ver}_linux_amd64.tar.gz" -o /tmp/oras.tar.gz
          sudo tar -xzf /tmp/oras.tar.gz -C /usr/local/bin oras
          oras version

      - name: Login to GitHub Packages (GHCR) with ephemeral GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push each binary to GitHub Packages
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          for dir in packages_in/*; do
            [ -d "$dir" ] || continue
            tag=$(basename "$dir")
            echo ">>> Pushing $tag to ghcr.io/${repo_lower}:${tag}"
            (
              cd "$dir"
              oras push "ghcr.io/${repo_lower}:${tag}" \
                --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
                *
            )
          done
